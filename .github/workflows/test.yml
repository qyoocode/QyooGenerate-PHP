name: PHP
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd
          coverage: none
      - run: php -l src/generate.php
      - run: php tests/test.php
      - run: php tests/http.php
      - run: php tests/cache.php .codex-work/ci-cache
